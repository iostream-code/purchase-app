<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Login — Purchase App</title>
    <link rel="stylesheet" href="../css/main.css">
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="card w-full max-w-sm p-6">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-gray-800">Purchase App</h1>
            <p class="text-sm text-gray-400 mt-1">Masuk ke akun Anda</p>
        </div>

        <form id="form-login" novalidate>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input id="input-username" type="text" class="input-field" placeholder="Masukkan username"
                    autocomplete="username">
                <p id="err-username" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input id="input-password" type="password" class="input-field" placeholder="Masukkan password"
                    autocomplete="current-password">
                <p id="err-password" class="text-xs text-red-500 mt-1 hidden"></p>
            </div>

            <button type="submit" id="btn-login" class="btn-primary w-full">
                Masuk
            </button>

            <p id="err-global" class="text-sm text-red-500 text-center mt-3 hidden"></p>
        </form>
    </div>

    <script type="module" src="../js/login.js"></script>
</body>

</html>
